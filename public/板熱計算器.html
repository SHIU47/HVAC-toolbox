<body class="min-h-screen text-slate-900 transition-colors duration-200 flex flex-col">
  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ==========================================
    // 0. SYSTEM CONFIGURATION & THRESHOLDS
    // ==========================================
    const SYSTEM_CONFIG = {
      THERMAL_BALANCE: {
        BALANCED_MAX_PERCENT: 2.0,      // <= 2% 完全平衡
        WARNING_MAX_PERCENT: 10.0,     // > 2% 且 <= 10% 輕微偏差
      },
      PINCH: {
        TIGHT_APPROACH_LIMIT_C: 5.0,  // < 5°C 觸發 Tight Approach
        CRITICAL_PINCH_C: 1.0,         // < 1°C 極度危險
      },
      VELOCITY: {
        MIN_RECOMMENDED_MS: 1.0,       // < 1.0 m/s 易沉積
        TARGET_RECOMMENDED_MS: 2.0,    // 目標建議接管流速 ~2.0 m/s
        MAX_RECOMMENDED_MS: 3.5,       // > 3.5 m/s 高壓降與沖蝕
      },
      PRESSURE_DROP: {
        DEFAULT_MAX_ALLOWABLE_KPA: 50.0, // 預設最大允許壓降 50 kPa
      },
      DEFAULT_U_VALUE: 4000,           // W/(m²·K) 純水對水基準
      DEFAULT_DESIGN_MARGIN: 10.0,    // % 設計裕量
      DEFAULT_FOULING_FACTOR: 0.00003, // m²·K/W 預設污垢熱阻
      DEFAULT_LMTD_F_FACTOR: 1.0,     // 逆流修正係數
    };

    const FLUID_TYPES = {
      WATER: 'WATER',
      PG: 'PG', // 丙二醇 (Propylene Glycol)
      EG: 'EG', // 乙二醇 (Ethylene Glycol)
    };

    const SOURCE_TYPE = {
      VALIDATED: 'VALIDATED_ASME_IWS',
      ESTIMATED: 'EMPIRICAL_GLYCOL_MATRIX'
    };

    // 標準 DN 接管規格數據庫 (口徑 m, mm, 吋)
    const STANDARD_DN_SIZES = [
      { dn: 'DN25', diameterM: 0.025, inches: '1"' },
      { dn: 'DN32', diameterM: 0.032, inches: '1.25"' },
      { dn: 'DN40', diameterM: 0.040, inches: '1.5"' },
      { dn: 'DN50', diameterM: 0.050, inches: '2"' },
      { dn: 'DN65', diameterM: 0.065, inches: '2.5"' },
      { dn: 'DN80', diameterM: 0.080, inches: '3"' },
      { dn: 'DN100', diameterM: 0.100, inches: '4"' },
      { dn: 'DN125', diameterM: 0.125, inches: '5"' },
      { dn: 'DN150', diameterM: 0.150, inches: '6"' },
      { dn: 'DN200', diameterM: 0.200, inches: '8"' },
      { dn: 'DN250', diameterM: 0.250, inches: '10"' },
      { dn: 'DN300', diameterM: 0.300, inches: '12"' }
    ];

    // ==========================================
    // 1. FLUID PROPERTY ENGINE
    // ==========================================
    class FluidPropertyEngine {
      static getFreezingPoint(type, concentrationPercent) {
        if (type === FLUID_TYPES.WATER) return 0;
        const c = Math.max(0, Math.min(60, concentrationPercent || 0));
        
        if (type === FLUID_TYPES.PG) {
          return -0.01144 * Math.pow(c, 2) - 0.098 * c;   // PG25 ≈ -9.6、PG40 ≈ -22、PG50 ≈ -33.5 °C
        } else if (type === FLUID_TYPES.EG) {
          return -0.01113 * Math.pow(c, 2) - 0.179 * c;   // EG30 ≈ -15.4、EG40 ≈ -25、EG50 ≈ -36.8 °C
        }
        return 0;
      }

      static getProperties(type, tempC, concentrationPercent = 25) {
        const T = Math.max(-10, Math.min(100, tempC));
        const conc = Math.max(0, Math.min(60, concentrationPercent)) / 100;

        const waterDensity = 999.8395 + 1.6945e-1 * T - 7.987e-3 * Math.pow(T, 2) + 4.617e-5 * Math.pow(T, 3);
        const waterCp = 4217.4 - 3.7202 * T + 0.14128 * Math.pow(T, 2) - 0.002654 * Math.pow(T, 3);
        const waterViscosity = 2.414e-5 * Math.pow(10, 247.8 / (T + 133.15));
        const waterConductivity = 0.5658 + 0.001825 * T - 0.0000078 * Math.pow(T, 2);

        if (type === FLUID_TYPES.WATER || conc === 0) {
          return {
            type: FLUID_TYPES.WATER,
            concentrationPercent: 0,
            freezingPointC: 0,
            density: waterDensity,
            specificHeat: waterCp,
            viscosity: waterViscosity,
            thermalConductivity: waterConductivity,
            sourceType: SOURCE_TYPE.VALIDATED,
            meanTemperatureC: tempC,
            displayName: '水 (Water)'
          };
        }

        const freezingPointC = this.getFreezingPoint(type, concentrationPercent);

        if (type === FLUID_TYPES.PG) {
          const density = waterDensity * (1 + 0.10 * conc);
          const specificHeat = waterCp * (1 - 0.30 * conc);   // PG25 ≈ 3.87、PG50 ≈ 3.56 kJ/kg·K
          const viscFactor = 1 + 4.5 * conc + 8.0 * Math.pow(conc, 2) * Math.exp(-T / 25);
          const viscosity = waterViscosity * viscFactor;
          const thermalConductivity = waterConductivity * (1 - 0.80 * conc);   // PG25 ≈ 0.48、PG50 ≈ 0.36 W/m·K

          return {
            type: FLUID_TYPES.PG,
            concentrationPercent,
            freezingPointC,
            density,
            specificHeat,
            viscosity,
            thermalConductivity,
            sourceType: SOURCE_TYPE.ESTIMATED,
            meanTemperatureC: tempC,
            displayName: `丙二醇 ${concentrationPercent}% (PG${concentrationPercent})`
          };
        } else {
          const density = waterDensity * (1 + 0.14 * conc);
          const specificHeat = waterCp * (1 - 0.42 * conc);   // EG30 ≈ 3.66、EG50 ≈ 3.30 kJ/kg·K
          const viscFactor = 1 + 3.2 * conc + 5.5 * Math.pow(conc, 2) * Math.exp(-T / 25);
          const viscosity = waterViscosity * viscFactor;
          const thermalConductivity = waterConductivity * (1 - 0.67 * conc);   // EG30 ≈ 0.48、EG50 ≈ 0.40 W/m·K

          return {
            type: FLUID_TYPES.EG,
            concentrationPercent,
            freezingPointC,
            density,
            specificHeat,
            viscosity,
            thermalConductivity,
            sourceType: SOURCE_TYPE.ESTIMATED,
            meanTemperatureC: tempC,
            displayName: `乙二醇 ${concentrationPercent}% (EG${concentrationPercent})`
          };
        }
      }
    }

    // ==========================================
    // 2. HYDRAULICS ENGINE
    // ==========================================
    class HydraulicSizingEngine {
      static evaluate(volumetricFlowM3s, fluidProps, overrideDN = null) {
        if (!volumetricFlowM3s || volumetricFlowM3s <= 0) {
          return {
            recommendedDN: STANDARD_DN_SIZES[3],
            selectedDN: STANDARD_DN_SIZES[3],
            velocityMS: 0,
            portAreaM2: 0,
            portPressureDropKPa: 0,
            estimatedTotalDPKPa: 0,
            status: 'NORMAL',
            warnings: []
          };
        }

        const targetVelocity = SYSTEM_CONFIG.VELOCITY.TARGET_RECOMMENDED_MS;

        let recommendedDN = STANDARD_DN_SIZES[0];
        let minDiff = Infinity;

        STANDARD_DN_SIZES.forEach(item => {
          const area = (Math.PI / 4) * Math.pow(item.diameterM, 2);
          const vel = volumetricFlowM3s / area;
          const diff = Math.abs(vel - targetVelocity);
          if (diff < minDiff) {
            minDiff = diff;
            recommendedDN = item;
          }
        });

        const selectedDN = overrideDN 
          ? (STANDARD_DN_SIZES.find(d => d.dn === overrideDN) || recommendedDN)
          : recommendedDN;

        const portArea = (Math.PI / 4) * Math.pow(selectedDN.diameterM, 2);
        const velocityMS = volumetricFlowM3s / portArea;

        const portDPKPa = (1.5 * fluidProps.density * Math.pow(velocityMS, 2) / 2) / 1000;
        const channelVelocityEst = 0.5;
        const channelDPKPa = (3.5 * fluidProps.density * Math.pow(channelVelocityEst, 2) / 2) / 1000 + 12.0;
        const estimatedTotalDPKPa = portDPKPa + channelDPKPa;

        const warnings = [];
        let status = 'PASS';

        if (velocityMS < SYSTEM_CONFIG.VELOCITY.MIN_RECOMMENDED_MS) {
          status = 'WARNING';
          warnings.push(`接管流速過低 (${velocityMS.toFixed(2)} m/s < 1.0 m/s)：可能導致流體分配不均。`);
        } else if (velocityMS > SYSTEM_CONFIG.VELOCITY.MAX_RECOMMENDED_MS) {
          status = 'WARNING';
          warnings.push(`接管流速過高 (${velocityMS.toFixed(2)} m/s > 3.5 m/s)：可能造成過大接管壓降與管路沖蝕。`);
        }

        return {
          recommendedDN,
          selectedDN,
          velocityMS,
          portAreaM2: portArea,
          portPressureDropKPa: portDPKPa,
          estimatedTotalDPKPa,
          status,
          warnings
        };
      }
    }

    // ==========================================
    // 3. UNIT CONVERTER
    // ==========================================
    class UnitConverter {
      static flowToM3s(val, unit) {
        const v = Number(val) || 0;
        switch (unit) {
          case 'm3/h': return v / 3600;
          case 'L/min': return (v / 1000) / 60;
          case 'GPM': return v * 0.0000630902;
          case 'm3/s': return v;
          default: return v / 3600;
        }
      }

      static m3sToFlow(m3s, unit) {
        const v = Number(m3s) || 0;
        switch (unit) {
          case 'm3/h': return v * 3600;
          case 'L/min': return v * 1000 * 60;
          case 'GPM': return v / 0.0000630902;
          case 'm3/s': return v;
          default: return v * 3600;
        }
      }
    }

    // ==========================================
    // 4. LINKED EXCEL FORMULA EXPORT ENGINE (XLSX)
    // ==========================================
    class LinkedExcelExporter {
      static exportToExcel(inputState, result) {
        if (!window.XLSX) {
          console.warn('Excel 模組尚未載入完成');
          return;
        }

        const wb = XLSX.utils.book_new();
        const sheetName = "PHE選型與水力連動計算書";
        const ws = {};
        const range = { s: { c: 0, r: 0 }, e: { c: 6, r: 35 } };

        const setCell = (cellRef, value, formula = null, format = null) => {
          const cell = { v: value };
          if (typeof value === 'number') cell.t = 'n';
          else if (typeof value === 'boolean') cell.t = 'b';
          else cell.t = 's';

          if (formula) cell.f = formula;
          if (format) cell.z = format;
          ws[cellRef] = cell;
        };

        setCell('A1', '板式熱交換器 (PHE) 工程選型與水力連動計算書');
        setCell('A2', `產生時間: ${new Date().toLocaleString()} | PHE Engine Phase 2.5 (With 3D Sizing Sync)`);

        setCell('A4', '【一、 雙側設計工況與輸入條件 (Input Parameters)】');
        setCell('A5', '參數項目 (Parameter)');
        setCell('B5', '一次側 (Primary Side)');
        setCell('C5', '二次側 (Secondary Side)');
        setCell('D5', '單位 (Unit)');
        setCell('E5', '說明 (Note)');

        setCell('A6', '流體介質名稱');
        setCell('B6', result.primaryResult ? result.primaryResult.fluidProperties.displayName : inputState.primary.fluid);
        setCell('C6', result.secondaryResult ? result.secondaryResult.fluidProperties.displayName : inputState.secondary.fluid);
        setCell('D6', '-');

        setCell('A7', '入口溫度 (Inlet Temp, Tin)');
        setCell('B7', Number(inputState.primary.inletTemp));
        setCell('C7', Number(inputState.secondary.inletTemp));
        setCell('D7', '°C');

        setCell('A8', '出口溫度 (Outlet Temp, Tout)');
        setCell('B8', Number(inputState.primary.outletTemp));
        setCell('C8', Number(inputState.secondary.outletTemp));
        setCell('D8', '°C');

        setCell('A9', '進出口溫差 (Delta T)');
        setCell('B9', Math.abs(inputState.primary.inletTemp - inputState.primary.outletTemp), '=ABS(B7-B8)');
        setCell('C9', Math.abs(inputState.secondary.inletTemp - inputState.secondary.outletTemp), '=ABS(C7-C8)');
        setCell('D9', '°C');

        setCell('A10', '設定體積流量 (Volumetric Flow)');
        setCell('B10', Number(result.primaryResult ? result.primaryResult.volumetricFlowM3h : 0));
        setCell('C10', Number(result.secondaryResult ? result.secondaryResult.volumetricFlowM3h : 0));
        setCell('D10', 'm³/h');

        setCell('A11', '流體密度 (Density, ρ)');
        setCell('B11', Number(result.primaryResult ? result.primaryResult.fluidProperties.density : 998));
        setCell('C11', Number(result.secondaryResult ? result.secondaryResult.fluidProperties.density : 998));
        setCell('D11', 'kg/m³');

        setCell('A12', '流體比熱 (Specific Heat, Cp)');
        setCell('B12', Number(result.primaryResult ? result.primaryResult.fluidProperties.specificHeat : 4180));
        setCell('C12', Number(result.secondaryResult ? result.secondaryResult.fluidProperties.specificHeat : 4180));
        setCell('D12', 'J/(kg·K)');

        setCell('A13', '質量流量 (Mass Flow Rate, m_dot)');
        setCell('B13', result.primaryResult ? result.primaryResult.massFlowKgS : 0, '=(B10*B11)/3600');
        setCell('C13', result.secondaryResult ? result.secondaryResult.massFlowKgS : 0, '=(C10*C11)/3600');
        setCell('D13', 'kg/s');

        setCell('A14', '計算熱負荷 (Calculated Duty, Q)');
        setCell('B14', result.primaryResult ? result.primaryResult.calculatedDutyKW : 0, '=(B13*B12*B9)/1000');
        setCell('C14', result.secondaryResult ? result.secondaryResult.calculatedDutyKW : 0, '=(C13*C12*C9)/1000');
        setCell('D14', 'kW');

        setCell('A16', '【二、 熱能量平衡與對數溫差計算 (Thermal Balance & LMTD)】');
        setCell('A17', '兩側熱負荷偏差率 (Thermal Balance Mismatch)');
        setCell('B17', result.thermalBalance ? result.thermalBalance.mismatchPercent : 0, '=ABS(B14-C14)/MAX(B14,C14)*100');
        setCell('D17', '%');
        setCell('E17', '< 2.0% 良好 ; > 10.0% 阻斷警告');

        setCell('A18', '有效設計熱負荷 (Effective Thermal Duty)');
        setCell('B18', result.thermalResult ? result.thermalResult.effectiveDutyKW : 0, '=AVERAGE(B14,C14)');
        setCell('D18', 'kW');

        setCell('A19', '逆流端點溫差 Delta T1 (Hot In - Cold Out)');
        setCell('B19', result.thermalResult ? result.thermalResult.deltaT1 : 0, '=IF(B7>=C7, B7-C8, C7-B8)');
        setCell('D19', '°C');

        setCell('A20', '逆流端點溫差 Delta T2 (Hot Out - Cold In)');
        setCell('B20', result.thermalResult ? result.thermalResult.deltaT2 : 0, '=IF(B7>=C7, B8-C7, C8-B7)');
        setCell('D20', '°C');

        setCell('A21', '最小接近溫差 (Pinch Temperature)');
        setCell('B21', result.thermalResult ? result.thermalResult.pinchTemp : 0, '=MIN(B19,B20)');
        setCell('D21', '°C');
        setCell('E21', '建議 Pinch > 5.0 °C');

        setCell('A22', '對數平均溫差 (LMTD)');
        setCell('B22', result.thermalResult ? result.thermalResult.lmtd : 0, '=IF(ABS(B19-B20)<0.001, B19, (B19-B20)/LN(B19/B20))');
        setCell('D22', '°C');

        setCell('A24', '【三、 板換選型面積計算 (Heat Transfer Area Sizing)】');
        setCell('A25', '基準清潔 U 值 (Base U Value)');
        setCell('B25', Number(inputState.global.estimatedUValue));
        setCell('D25', 'W/(m²·K)');

        setCell('A26', '物性修正後清潔 U 值 (U_clean)');
        setCell('B26', result.thermalResult ? result.thermalResult.adjustedUValue : 4000);
        setCell('D26', 'W/(m²·K)');
        setCell('E26', '兩側膜係數依導熱/黏度修正後串聯 (程式計算值)');

        setCell('A27', '污垢熱阻 (Fouling Factor, Rf)');
        setCell('B27', Number(inputState.global.foulingFactor) || 0);
        setCell('D27', 'm²·K/W');

        const uClean = result.thermalResult ? result.thermalResult.adjustedUValue : 4000;
        const rf = Number(inputState.global.foulingFactor) || 0;
        const uDirty = 1 / ((1 / uClean) + rf);
        setCell('A28', '考慮污垢後總熱傳 U 值 (U_dirty)');
        setCell('B28', uDirty, '=1/((1/B26)+B27)');
        setCell('D28', 'W/(m²·K)');

        setCell('A29', '淨所需換熱面積 (Required Heat Area, A_req)');
        setCell('B29', result.thermalResult ? result.thermalResult.requiredAreaM2 : 0, '=(B18*1000)/(B28*B22)');
        setCell('D29', 'm²');

        setCell('A30', '設計安全裕量 (Design Margin)');
        setCell('B30', result.thermalResult ? result.thermalResult.designMarginPercent : 0);
        setCell('D30', '%');

        setCell('A31', '最終設計換熱面積 (Design Heat Area, A_des)');
        setCell('B31', result.thermalResult ? result.thermalResult.designAreaM2 : 0, '=B29*(1+(B30/100))');
        setCell('D31', 'm²');

        setCell('A33', '【四、 水力學與接管流速診斷 (Hydraulic & Port Velocity)】');
        setCell('A34', '選定接管 DN 口徑 (Selected Port Size)');
        setCell('B34', result.primaryResult ? result.primaryResult.hydraulics.selectedDN.dn : 'DN50');
        setCell('C34', result.secondaryResult ? result.secondaryResult.hydraulics.selectedDN.dn : 'DN50');
        setCell('A35', '接管流速 (Port Velocity)');
        setCell('B35', result.primaryResult ? result.primaryResult.hydraulics.velocityMS : 0);
        setCell('C35', result.secondaryResult ? result.secondaryResult.hydraulics.velocityMS : 0);
        setCell('D35', 'm/s');

        ws['!cols'] = [{ wch: 38 }, { wch: 22 }, { wch: 22 }, { wch: 12 }, { wch: 32 }];
        ws['!ref'] = XLSX.utils.encode_range(range);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);

        const fileName = `PHE_Sizing_Linked_Sheet_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(wb, fileName);
      }
    }

    // ==========================================
    // 5. THERMAL & SIZING CALCULATION ENGINE
    // ==========================================
    class ThermalCalculationEngine {
      static calculate(inputState) {
        const primary = { ...inputState.primary };
        const secondary = { ...inputState.secondary };
        const global = { ...inputState.global };

        const checks = {
          temperatureProfile: { name: '溫度條件與物理溫差分析', status: 'PASS', messages: [] },
          freezingProtection: { name: '冰點防護與防結冰檢查', status: 'PASS', messages: [] },
          thermalBalance: { name: '熱能量平衡檢查', status: 'PASS', messages: [] },
          lmtdValidity: { name: 'LMTD 與接近溫差 (Pinch)', status: 'PASS', messages: [] },
          hydraulics: { name: '水力學、接管流速與壓降評估', status: 'PASS', messages: [] },
          sizingResult: { name: '換熱面積選型評估', status: 'PASS', messages: [] }
        };

        const errors = [];
        const warnings = [];

        if (primary.inputType === 'SOLVE' && secondary.inputType === 'SOLVE') {
          const errMsg = '無法計算：至少需要一側提供已知流量或熱負荷。';
          errors.push(errMsg);
          checks.thermalBalance.status = 'FAIL';
          checks.thermalBalance.messages.push(errMsg);

          return {
            isValid: false,
            errorMessage: errMsg,
            validation: { status: 'FAIL', checks, errors, warnings },
            primaryResult: { volumetricFlowDisplay: 0, calculatedDutyKW: 0, modeStatus: 'ERROR' },
            secondaryResult: { volumetricFlowDisplay: 0, calculatedDutyKW: 0, modeStatus: 'ERROR' },
            thermalBalance: { primaryDutyKW: 0, secondaryDutyKW: 0, differenceKW: 0, mismatchPercent: 0, status: 'ERROR' },
            thermalResult: { effectiveDutyKW: null, designDutyKW: null, lmtd: null, pinchTemp: null, requiredAreaM2: null, designAreaM2: null }
          };
        }

        const T_p_avg = (primary.inletTemp + primary.outletTemp) / 2;
        const T_s_avg = (secondary.inletTemp + secondary.outletTemp) / 2;

        const prop_p = FluidPropertyEngine.getProperties(primary.fluid, T_p_avg, primary.concentrationPercent);
        const prop_s = FluidPropertyEngine.getProperties(secondary.fluid, T_s_avg, secondary.concentrationPercent);

        const minPTemp = Math.min(primary.inletTemp, primary.outletTemp);
        const minSTemp = Math.min(secondary.inletTemp, secondary.outletTemp);

        if (minPTemp < prop_p.freezingPointC + 3.0) {
          checks.freezingProtection.status = 'WARNING';
          checks.freezingProtection.messages.push(`一次側最低溫度 (${minPTemp.toFixed(1)}°C) 過度接近介質冰點 (${prop_p.freezingPointC.toFixed(1)}°C)，存在結冰風險！`);
          warnings.push(`一次側有低溫結冰風險。`);
        }
        if (minSTemp < prop_s.freezingPointC + 3.0) {
          checks.freezingProtection.status = 'WARNING';
          checks.freezingProtection.messages.push(`二次側最低溫度 (${minSTemp.toFixed(1)}°C) 過度接近介質冰點 (${prop_s.freezingPointC.toFixed(1)}°C)，存在結冰風險！`);
          warnings.push(`二次側有低溫結冰風險。`);
        }

        const deltaT_p = Math.abs(primary.inletTemp - primary.outletTemp);
        const deltaT_s = Math.abs(secondary.inletTemp - secondary.outletTemp);

        const isPrimaryHot = primary.inletTemp >= secondary.inletTemp;
        const hotIn = isPrimaryHot ? primary.inletTemp : secondary.inletTemp;
        const hotOut = isPrimaryHot ? primary.outletTemp : secondary.outletTemp;
        const coldIn = isPrimaryHot ? secondary.inletTemp : primary.inletTemp;
        const coldOut = isPrimaryHot ? secondary.outletTemp : primary.outletTemp;

        const hotDeltaT = hotIn - hotOut;
        const coldDeltaT = coldOut - coldIn;

        if (hotDeltaT <= 0 || coldDeltaT <= 0) {
          checks.temperatureProfile.status = 'FAIL';
          checks.temperatureProfile.messages.push('溫度方向不合理：熱側入口必須大於出口，冷側出口必須大於入口。');
          errors.push('進出口溫度方向不符熱傳學規律。');
        }

        const deltaT1 = hotIn - coldOut;
        const deltaT2 = hotOut - coldIn;
        const pinchTemp = Math.min(deltaT1, deltaT2);

        if (deltaT1 <= 0 || deltaT2 <= 0) {
          checks.temperatureProfile.status = 'FAIL';
          checks.temperatureProfile.messages.push(`溫度交叉（Temperature Cross）：端點溫差 ΔT1 = ${deltaT1.toFixed(1)}°C, ΔT2 = ${deltaT2.toFixed(1)}°C。逆流換熱物理上不可行。`);
          errors.push('發生物理不可行之溫度交叉條件。');
        } else if (pinchTemp < SYSTEM_CONFIG.PINCH.TIGHT_APPROACH_LIMIT_C) {
          checks.lmtdValidity.status = 'WARNING';
          checks.lmtdValidity.messages.push(`接近溫差過小（Pinch = ${pinchTemp.toFixed(1)}°C < 5.0°C）。換熱器需要極大換熱面積。`);
          warnings.push(`接近溫差過小 (${pinchTemp.toFixed(1)}°C)。`);
        }

        let Q_p_W = 0, m_p_kgs = 0, V_p_m3s = 0, primaryModeStatus = 'CALCULATED';
        let Q_s_W = 0, m_s_kgs = 0, V_s_m3s = 0, secondaryModeStatus = 'CALCULATED';

        if (primary.inputType === 'FLOW') {
          V_p_m3s = UnitConverter.flowToM3s(primary.flowRate, primary.flowUnit);
          m_p_kgs = V_p_m3s * prop_p.density;
          Q_p_W = m_p_kgs * prop_p.specificHeat * deltaT_p;
          primaryModeStatus = 'INPUT';
        } else if (primary.inputType === 'DUTY') {
          Q_p_W = (Number(primary.heatDuty) || 0) * 1000;
          m_p_kgs = deltaT_p > 0 ? Q_p_W / (prop_p.specificHeat * deltaT_p) : 0;
          V_p_m3s = m_p_kgs / prop_p.density;
          primaryModeStatus = 'INPUT';
        }

        if (secondary.inputType === 'FLOW') {
          V_s_m3s = UnitConverter.flowToM3s(secondary.flowRate, secondary.flowUnit);
          m_s_kgs = V_s_m3s * prop_s.density;
          Q_s_W = m_s_kgs * prop_s.specificHeat * deltaT_s;
          secondaryModeStatus = 'INPUT';
        } else if (secondary.inputType === 'DUTY') {
          Q_s_W = (Number(secondary.heatDuty) || 0) * 1000;
          m_s_kgs = deltaT_s > 0 ? Q_s_W / (prop_s.specificHeat * deltaT_s) : 0;
          V_s_m3s = m_s_kgs / prop_s.density;
          secondaryModeStatus = 'INPUT';
        }

        if (primary.inputType === 'SOLVE') {
          Q_p_W = Q_s_W;
          m_p_kgs = deltaT_p > 0 ? Q_p_W / (prop_p.specificHeat * deltaT_p) : 0;
          V_p_m3s = m_p_kgs / prop_p.density;
          primaryModeStatus = 'SOLVED';
        }
        if (secondary.inputType === 'SOLVE') {
          Q_s_W = Q_p_W;
          m_s_kgs = deltaT_s > 0 ? Q_s_W / (prop_s.specificHeat * deltaT_s) : 0;
          V_s_m3s = m_s_kgs / prop_s.density;
          secondaryModeStatus = 'SOLVED';
        }

        const primaryDutyKW = Q_p_W / 1000;
        const secondaryDutyKW = Q_s_W / 1000;
        const diffKW = Math.abs(primaryDutyKW - secondaryDutyKW);
        const maxDutyKW = Math.max(primaryDutyKW, secondaryDutyKW);
        const mismatchPercent = maxDutyKW > 0 ? (diffKW / maxDutyKW) * 100 : 0;

        let balanceStatus = 'BALANCED';
        if (mismatchPercent > SYSTEM_CONFIG.THERMAL_BALANCE.WARNING_MAX_PERCENT) {
          balanceStatus = 'MAJOR_MISMATCH';
          checks.thermalBalance.status = 'FAIL';
          checks.thermalBalance.messages.push(`熱平衡嚴重偏差：一次側 (${primaryDutyKW.toFixed(1)} kW) 與二次側 (${secondaryDutyKW.toFixed(1)} kW) 差異達 ${mismatchPercent.toFixed(1)}% (>10%)。`);
          errors.push(`熱負荷偏差過大 (${mismatchPercent.toFixed(1)}%)。`);
        } else if (mismatchPercent > SYSTEM_CONFIG.THERMAL_BALANCE.BALANCED_MAX_PERCENT) {
          balanceStatus = 'MINOR_MISMATCH';
          checks.thermalBalance.status = 'WARNING';
          checks.thermalBalance.messages.push(`熱不完全平衡：兩側熱負荷偏差 ${mismatchPercent.toFixed(1)}%。`);
          warnings.push(`熱負荷不完全匹配 (${mismatchPercent.toFixed(1)}%)。`);
        } else {
          checks.thermalBalance.messages.push(`熱平衡良好：兩側熱負荷匹配 (偏差 ${mismatchPercent.toFixed(2)}%)。`);
        }

        let effectiveDutyKW = 0;
        if (primary.inputType === 'SOLVE') effectiveDutyKW = secondaryDutyKW;
        else if (secondary.inputType === 'SOLVE') effectiveDutyKW = primaryDutyKW;
        else effectiveDutyKW = (primaryDutyKW + secondaryDutyKW) / 2;

        const effectiveDutyW = effectiveDutyKW * 1000;

        const hydro_p = HydraulicSizingEngine.evaluate(V_p_m3s, prop_p, primary.overrideDN);
        const hydro_s = HydraulicSizingEngine.evaluate(V_s_m3s, prop_s, secondary.overrideDN);

        if (hydro_p.status === 'WARNING') {
          checks.hydraulics.status = 'WARNING';
          hydro_p.warnings.forEach(w => checks.hydraulics.messages.push(`[一次側] ${w}`));
        }
        if (hydro_s.status === 'WARNING') {
          checks.hydraulics.status = 'WARNING';
          hydro_s.warnings.forEach(w => checks.hydraulics.messages.push(`[二次側] ${w}`));
        }

        const maxAllowableDP = Number(global.maxAllowableDP) || SYSTEM_CONFIG.PRESSURE_DROP.DEFAULT_MAX_ALLOWABLE_KPA;
        if (hydro_p.estimatedTotalDPKPa > maxAllowableDP) {
          checks.hydraulics.status = 'WARNING';
          checks.hydraulics.messages.push(`一次側預估總壓降 (${hydro_p.estimatedTotalDPKPa.toFixed(1)} kPa) 超過允許上限 (${maxAllowableDP} kPa)。`);
        }
        if (hydro_s.estimatedTotalDPKPa > maxAllowableDP) {
          checks.hydraulics.status = 'WARNING';
          checks.hydraulics.messages.push(`二次側預估總壓降 (${hydro_s.estimatedTotalDPKPa.toFixed(1)} kPa) 超過允許上限 (${maxAllowableDP} kPa)。`);
        }

        let lmtd = 0;
        if (deltaT1 > 0 && deltaT2 > 0) {
          if (Math.abs(deltaT1 - deltaT2) < 1e-4) {
            lmtd = deltaT1;
          } else {
            lmtd = (deltaT1 - deltaT2) / Math.log(deltaT1 / deltaT2);
          }
        }

        const baseU = Number(global.estimatedUValue) || SYSTEM_CONFIG.DEFAULT_U_VALUE;
        const waterProp = FluidPropertyEngine.getProperties(FLUID_TYPES.WATER, 25, 0);

        const condFactor_p = Math.pow(prop_p.thermalConductivity / waterProp.thermalConductivity, 0.6);
        const viscFactor_p = Math.pow(waterProp.viscosity / prop_p.viscosity, 0.15);
        const condFactor_s = Math.pow(prop_s.thermalConductivity / waterProp.thermalConductivity, 0.6);
        const viscFactor_s = Math.pow(waterProp.viscosity / prop_s.viscosity, 0.15);

        // 兩側膜係數串聯：基準 U 視為兩側相同膜係數 h0 = 2·U0（板壁熱阻併入），各側依物性修正後 1/U = 1/h_p + 1/h_s
        const h_p = 2 * baseU * condFactor_p * viscFactor_p;
        const h_s = 2 * baseU * condFactor_s * viscFactor_s;
        const adjustedUValue = 1 / (1 / h_p + 1 / h_s);

        const F_factor = SYSTEM_CONFIG.DEFAULT_LMTD_F_FACTOR;
        const marginPercent = Number.isFinite(Number(global.designMargin)) && global.designMargin !== '' ? Number(global.designMargin) : SYSTEM_CONFIG.DEFAULT_DESIGN_MARGIN;
        const foulingR = Number(global.foulingFactor) || 0;

        let requiredAreaM2 = null;
        let designAreaM2 = null;

        const isPhysicallyValid = errors.length === 0 && balanceStatus !== 'MAJOR_MISMATCH';

        if (isPhysicallyValid && lmtd > 0 && adjustedUValue > 0) {
          const U_dirty = 1 / ((1 / adjustedUValue) + foulingR);
          requiredAreaM2 = effectiveDutyW / (U_dirty * lmtd * F_factor);
          designAreaM2 = requiredAreaM2 * (1 + marginPercent / 100);
        } else {
          checks.sizingResult.status = 'FAIL';
          checks.sizingResult.messages.push('條件不符熱傳物理，停止計算換熱面積。');
        }

        let overallStatus = 'PASS';
        if (errors.length > 0 || balanceStatus === 'MAJOR_MISMATCH') overallStatus = 'FAIL';
        else if (warnings.length > 0 || balanceStatus === 'MINOR_MISMATCH' || checks.hydraulics.status === 'WARNING') overallStatus = 'WARNING';

        return {
          isValid: isPhysicallyValid,
          isPrimaryHot,
          primaryResult: {
            inletTemp: primary.inletTemp,
            outletTemp: primary.outletTemp,
            deltaT: deltaT_p,
            massFlowKgS: m_p_kgs,
            volumetricFlowM3h: UnitConverter.m3sToFlow(V_p_m3s, 'm3/h'),
            volumetricFlowDisplay: UnitConverter.m3sToFlow(V_p_m3s, primary.flowUnit),
            calculatedDutyKW: primaryDutyKW,
            modeStatus: primaryModeStatus,
            fluidProperties: prop_p,
            hydraulics: hydro_p
          },
          secondaryResult: {
            inletTemp: secondary.inletTemp,
            outletTemp: secondary.outletTemp,
            deltaT: deltaT_s,
            massFlowKgS: m_s_kgs,
            volumetricFlowM3h: UnitConverter.m3sToFlow(V_s_m3s, 'm3/h'),
            volumetricFlowDisplay: UnitConverter.m3sToFlow(V_s_m3s, secondary.flowUnit),
            calculatedDutyKW: secondaryDutyKW,
            modeStatus: secondaryModeStatus,
            fluidProperties: prop_s,
            hydraulics: hydro_s
          },
          thermalBalance: {
            primaryDutyKW,
            secondaryDutyKW,
            differenceKW: diffKW,
            mismatchPercent,
            status: balanceStatus,
            effectiveDutyKW
          },
          thermalResult: {
            effectiveDutyKW,
            designDutyKW: effectiveDutyKW * (1 + marginPercent / 100),
            hotIn,
            hotOut,
            coldIn,
            coldOut,
            deltaT1,
            deltaT2,
            lmtd,
            pinchTemp,
            baseUValue: baseU,
            adjustedUValue,
            requiredAreaM2,
            designAreaM2,
            designMarginPercent: marginPercent,
            foulingFactor: foulingR
          },
          validation: {
            status: overallStatus,
            checks,
            errors,
            warnings
          }
        };
      }
    }

    // ==========================================
    // 7. THREE.JS 3D PHE VISUALIZER COMPONENT
    // ==========================================
    // 逆流板換沿板高的溫度分布（精確解）：ΔT 沿換熱面積呈指數變化，ΔT(x) = ΔT1·r^x，r = ΔT2/ΔT1
    // x = 0 為熱側入口端（頂部），x = 1 為熱側出口端（底部）；q(x) 為累積熱量比例
    function counterflowProfile(tr) {
      const ok = tr && tr.deltaT1 > 0 && tr.deltaT2 > 0 && tr.hotIn > tr.hotOut && tr.coldOut > tr.coldIn;
      const r = ok ? tr.deltaT2 / tr.deltaT1 : 1;
      const q = x => (!ok || Math.abs(r - 1) < 1e-6) ? x : (Math.pow(r, x) - 1) / (r - 1);
      const hotIn = tr ? tr.hotIn : 32, hotOut = tr ? tr.hotOut : 27, coldIn = tr ? tr.coldIn : 22, coldOut = tr ? tr.coldOut : 27;
      return {
        hotIn, hotOut, coldIn, coldOut, valid: ok,
        Th: x => hotIn - (hotIn - hotOut) * q(x),
        Tc: x => coldOut - (coldOut - coldIn) * q(x)
      };
    }
    // 色階：冷側入口（藍）→ 熱側入口（紅）
    const PHE_STOPS = [[0, [0.15, 0.39, 0.92]], [0.3, [0.02, 0.71, 0.83]], [0.55, [0.06, 0.73, 0.51]], [0.78, [0.96, 0.62, 0.04]], [1, [0.94, 0.27, 0.27]]];
    function pheRamp(w) {
      const v = Math.max(0, Math.min(1, w));
      for (let i = 1; i < PHE_STOPS.length; i++) {
        if (v <= PHE_STOPS[i][0]) { const [x0, c0] = PHE_STOPS[i - 1], [x1, c1] = PHE_STOPS[i], k = (v - x0) / (x1 - x0); return c0.map((c, j) => c + (c1[j] - c) * k); }
      }
      return PHE_STOPS[PHE_STOPS.length - 1][1];
    }
    const pheRampCss = w => `rgb(${pheRamp(w).map(v => Math.round(v * 255)).join(',')})`;
    function pheTextSprite(text, color, h) {
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d'), fs = 44;
      ctx.font = `700 ${fs}px Consolas, monospace`;
      cv.width = Math.ceil(ctx.measureText(text).width) + 24; cv.height = fs + 20;
      ctx.font = `700 ${fs}px Consolas, monospace`;
      ctx.fillStyle = 'rgba(15,23,42,0.82)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 12, cv.height / 2 + 2);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
      sp.scale.set(h * cv.width / cv.height, h, 1); sp.renderOrder = 10;
      return sp;
    }

    const PLATE_VERT = `
      varying vec2 vUv;
      varying vec3 vN;
      void main() {
        vUv = uv;
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    // 板片 shader：溫度貼圖（沿板高）+ 人字波紋 + 四角孔 + 周邊墊片
    const PLATE_FRAG = `
      uniform sampler2D uTemp;
      uniform vec2 uSize;
      uniform vec2 uPort;      // 角孔中心 (±x, ±y)，板片局部座標 m
      uniform float uPortR;
      uniform float uFlip;     // 相鄰板片人字方向相反
      uniform float uDim;
      varying vec2 vUv;
      varying vec3 vN;
      void main() {
        vec2 p = (vUv - 0.5) * uSize;
        for (int i = 0; i < 4; i++) {
          vec2 c = vec2(i < 2 ? -uPort.x : uPort.x, mod(float(i), 2.0) < 0.5 ? uPort.y : -uPort.y);
          if (length(p - c) < uPortR) discard;
        }
        vec3 col = texture2D(uTemp, vec2(0.5, vUv.y)).rgb;
        // 人字波紋（只在換熱區，上下分配區除外）
        float inField = step(abs(p.y), uPort.y - uPortR * 1.4);
        float v = (p.y * uFlip + abs(p.x) * 0.58) / (uSize.x * 0.045);
        float ridge = smoothstep(0.35, 0.5, abs(fract(v) - 0.5));
        col *= mix(1.0, 0.72 + 0.28 * (1.0 - ridge), inField);
        // 角孔墊片環與周邊墊片
        float ring = 1.0;
        for (int i = 0; i < 4; i++) {
          vec2 c = vec2(i < 2 ? -uPort.x : uPort.x, mod(float(i), 2.0) < 0.5 ? uPort.y : -uPort.y);
          float d = length(p - c) - uPortR;
          ring = min(ring, smoothstep(0.0, uPortR * 0.25, d));
        }
        vec2 e = uSize * 0.5 - abs(p);
        float edge = smoothstep(0.0, uSize.x * 0.03, min(e.x, e.y));
        col = mix(vec3(0.08, 0.09, 0.11), col, min(ring, edge));
        float lit = 0.62 + 0.38 * abs(dot(normalize(vN), normalize(vec3(0.4, 0.6, 0.7))));
        gl_FragColor = vec4(col * lit * uDim, 1.0);
      }
    `;

    function PHE3DViewer({ result, isDarkMode }) {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const controlsRef = useRef(null);
      const pheGroupRef = useRef(null);
      const flowRef = useRef(null);
      const [autoRotate, setAutoRotate] = useState(false);
      const autoRotateRef = useRef(false);
      const [exploded, setExploded] = useState(false);
      const [showFlow, setShowFlow] = useState(true);
      const showFlowRef = useRef(true);
      const [plateInfo, setPlateInfo] = useState({ real: 0, shown: 0, area: 0 });

      const designArea = (result && result.thermalResult && result.thermalResult.designAreaM2) || 8.5;
      const primaryDN = (result && result.primaryResult && result.primaryResult.hydraulics.selectedDN) || STANDARD_DN_SIZES[3];
      const secondaryDN = (result && result.secondaryResult && result.secondaryResult.hydraulics.selectedDN) || STANDARD_DN_SIZES[3];
      const isPrimaryHot = result ? result.isPrimaryHot !== false : true;
      const prof = useMemo(() => counterflowProfile(result && result.thermalResult), [result]);
      const thermalKey = `${prof.hotIn}_${prof.hotOut}_${prof.coldIn}_${prof.coldOut}_${isPrimaryHot}`;
      const Tmin = prof.coldIn, Tspan = Math.max(0.1, prof.hotIn - prof.coldIn);
      const wOf = T => (T - Tmin) / Tspan;

      const handleToggleRotate = () => {
        const next = !autoRotate;
        setAutoRotate(next);
        autoRotateRef.current = next;
        if (controlsRef.current) controlsRef.current.autoRotate = next;
      };
      const toggleFlow = () => { const n = !showFlow; setShowFlow(n); showFlowRef.current = n; if (flowRef.current) flowRef.current.points.visible = n; };

      // 初始化場景
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const width = container.clientWidth || 360, height = container.clientHeight || 420;
        const scene = new THREE.Scene();
        sceneRef.current = scene;
        const camera = new THREE.PerspectiveCamera(38, width / height, 0.05, 200);
        camera.position.set(4.2, 2.6, 5.0);
        cameraRef.current = camera;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;
        if (window.THREE && window.THREE.OrbitControls) {
          const controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.08;
          controls.autoRotate = autoRotateRef.current;
          controls.autoRotateSpeed = 1.6;
          controlsRef.current = controls;
        }
        scene.add(new THREE.HemisphereLight(0xe2e8f0, 0x1e293b, 0.75));
        const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(6, 9, 7); scene.add(key);
        const rim = new THREE.DirectionalLight(0x38bdf8, 0.45); rim.position.set(-6, -3, -5); scene.add(rim);
        const pheGroup = new THREE.Group();
        scene.add(pheGroup);
        pheGroupRef.current = pheGroup;

        let raf, last = performance.now();
        const animate = now => {
          raf = requestAnimationFrame(animate);
          const dt = Math.min(0.05, ((now || performance.now()) - last) / 1000);
          last = now || performance.now();
          if (controlsRef.current) { controlsRef.current.autoRotate = autoRotateRef.current; controlsRef.current.update(); }
          const f = flowRef.current;
          if (f && showFlowRef.current) {
            const pos = f.geo.attributes.position.array, col = f.geo.attributes.color.array;
            for (let i = 0; i < f.n; i++) {
              f.s[i] = (f.s[i] + dt * f.speed[i]) % 1;
              const s = f.s[i], hot = f.hot[i];
              // 熱側：頂部入口角孔 → 擴散 → 底部出口角孔；冷側相反方向
              const spread = Math.pow(Math.sin(Math.PI * s), 0.6);
              const x = f.portX[i] + (f.xT[i] - f.portX[i]) * spread;
              const y = hot ? f.yTop - s * (f.yTop - f.yBot) : f.yBot + s * (f.yTop - f.yBot);
              pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = f.z[i];
              const xp = (f.yTop - y) / (f.yTop - f.yBot);         // 自頂部起算的板高比例
              const c = pheRamp(f.wOf(hot ? f.prof.Th(xp) : f.prof.Tc(xp)));
              col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
            }
            f.geo.attributes.position.needsUpdate = true; f.geo.attributes.color.needsUpdate = true;
          }
          renderer.render(scene, camera);
        };
        raf = requestAnimationFrame(animate);

        const handleResize = () => {
          const w = container.clientWidth, h = container.clientHeight || 420;
          if (!w) return;
          camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);
        const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(handleResize) : null;
        if (ro) ro.observe(container);
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', handleResize);
          if (ro) ro.disconnect();
          if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      // 依選型結果重建幾何
      useEffect(() => {
        const g = pheGroupRef.current;
        if (!g) return;
        g.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
            if (m.map) m.map.dispose();
            if (m.uniforms && m.uniforms.uTemp && m.uniforms.uTemp.value) m.uniforms.uTemp.value.dispose();
            m.dispose();
          });
        });
        while (g.children.length) g.remove(g.children[0]);
        flowRef.current = null;

        // ---- 板框系列：依面積與接管口徑選單板換熱面積（真實系列 0.25 ~ 1.3 m²/片） ----
        const maxPortD = Math.max(primaryDN.diameterM, secondaryDN.diameterM);
        let plateArea = 0.25;
        if (designArea > 60 || maxPortD >= 0.20) plateArea = 1.3;
        else if (designArea > 25 || maxPortD >= 0.125) plateArea = 0.8;
        else if (designArea > 10 || maxPortD >= 0.08) plateArea = 0.45;
        const flangeDia = maxPortD * 1.55;
        const W = Math.max(flangeDia * 2 + 0.18, Math.sqrt(plateArea / 2.4) * 1.25);
        const H = Math.max(flangeDia * 2 + 0.55, Math.sqrt(plateArea / 2.4) * 2.4 * 1.15, W * 2.1);
        // 板片數：熱傳板片 = 面積 ÷ 單板面積，另加前後兩片端板
        const realPlates = Math.ceil(designArea / plateArea - 1e-9) + 2;
        const shownPlates = Math.min(realPlates, exploded ? 26 : 90);
        const pitch = exploded ? Math.max(0.07, H * 0.05) : 0.022;
        const pack = shownPlates * pitch;
        const frameT = Math.max(0.08, H * 0.035);
        setPlateInfo({ real: realPlates, shown: shownPlates, area: plateArea });

        const Wp = W * 0.9, Hp = H * 0.9;
        const portR = Math.max(primaryDN.diameterM, secondaryDN.diameterM) * 0.55;
        const portX = Math.max(portR * 1.6 + 0.05, W * 0.26), portY = Math.max(portR * 1.6 + 0.08, H * 0.35);
        const yTop = portY, yBot = -portY;

        if (cameraRef.current && controlsRef.current) {
          const maxDim = Math.max(H, pack + frameT * 2, W);
          const d = maxDim * 2.0;
          cameraRef.current.position.set(d * 0.8, d * 0.42, d * 0.9);
          controlsRef.current.target.set(0, 0, 0);
          controlsRef.current.minDistance = maxDim * 0.6;
          controlsRef.current.maxDistance = maxDim * 5;
          controlsRef.current.update();
        }

        const std = o => new THREE.MeshStandardMaterial(o);
        const frameMat = std({ color: isDarkMode ? 0x1e3a5f : 0x1e40af, metalness: 0.45, roughness: 0.45 });   // 框架常見烤漆藍
        const steelMat = std({ color: 0xcbd5e1, metalness: 0.88, roughness: 0.2 });
        const darkMat = std({ color: 0x334155, metalness: 0.7, roughness: 0.35 });

        // 溫度貼圖：熱側 Th(x)、冷側 Tc(x) 沿板高（uv.y = 1 為頂部）
        const makeTempTex = fn => {
          const N = 64, d = new Uint8Array(N * 4);
          for (let i = 0; i < N; i++) {
            const xp = 1 - i / (N - 1);
            const c = pheRamp(wOf(fn(xp)));
            d[i * 4] = c[0] * 255; d[i * 4 + 1] = c[1] * 255; d[i * 4 + 2] = c[2] * 255; d[i * 4 + 3] = 255;
          }
          const t = new THREE.DataTexture(d, 1, N, THREE.RGBAFormat);
          t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
          return t;
        };
        const plateMat = (fn, flip) => new THREE.ShaderMaterial({
          vertexShader: PLATE_VERT, fragmentShader: PLATE_FRAG, side: THREE.DoubleSide,
          uniforms: { uTemp: { value: makeTempTex(fn) }, uSize: { value: new THREE.Vector2(Wp, Hp) }, uPort: { value: new THREE.Vector2(portX, portY) }, uPortR: { value: portR }, uFlip: { value: flip }, uDim: { value: 1 } }
        });
        const matHot = [plateMat(prof.Th, 1), plateMat(prof.Th, -1)];
        const matCold = [plateMat(prof.Tc, 1), plateMat(prof.Tc, -1)];

        // 1. 固定端板（前）、活動壓緊板（後）
        const front = new THREE.Mesh(new THREE.BoxGeometry(W, H, frameT), frameMat);
        front.position.z = pack / 2 + frameT / 2; g.add(front);
        const back = new THREE.Mesh(new THREE.BoxGeometry(W, H, frameT), frameMat);
        back.position.z = -pack / 2 - frameT / 2; g.add(back);

        // 2. 板片包：板片以其「後方流道」的流體著色，熱／冷交錯，人字方向交替
        const plateGeo = new THREE.BoxGeometry(Wp, Hp, 0.004);
        for (let i = 0; i < shownPlates; i++) {
          const hotCh = i % 2 === 0;
          const m = new THREE.Mesh(plateGeo, (hotCh ? matHot : matCold)[Math.floor(i / 2) % 2]);
          m.position.z = pack / 2 - i * pitch - pitch / 2;
          g.add(m);
        }

        // 3. 角孔集管（貫穿板包）：一次側在左、二次側在右；熱側入口在上、冷側入口在下（逆流）
        const pIn = { x: -portX, y: isPrimaryHot ? yTop : yBot }, pOut = { x: -portX, y: isPrimaryHot ? yBot : yTop };
        const sIn = { x: portX, y: isPrimaryHot ? yBot : yTop }, sOut = { x: portX, y: isPrimaryHot ? yTop : yBot };
        const pr = result && result.primaryResult, sr = result && result.secondaryResult;
        const ports = [
          { id: 'P1', name: '一次側入口', at: pIn, T: pr ? pr.inletTemp : prof.hotIn, r: primaryDN.diameterM / 2, dir: 'in' },
          { id: 'P2', name: '一次側出口', at: pOut, T: pr ? pr.outletTemp : prof.hotOut, r: primaryDN.diameterM / 2, dir: 'out' },
          { id: 'S1', name: '二次側入口', at: sIn, T: sr ? sr.inletTemp : prof.coldIn, r: secondaryDN.diameterM / 2, dir: 'in' },
          { id: 'S2', name: '二次側出口', at: sOut, T: sr ? sr.outletTemp : prof.coldOut, r: secondaryDN.diameterM / 2, dir: 'out' }
        ];
        const nozL = Math.max(0.24, maxPortD * 1.3), lblH = Math.max(0.055, H * 0.034);
        ports.forEach(pt => {
          const c = pheRamp(wOf(pt.T));
          const tcol = new THREE.Color(c[0], c[1], c[2]);
          // 集管（半透明）
          const hdr = new THREE.Mesh(new THREE.CylinderGeometry(pt.r * 0.92, pt.r * 0.92, pack, 24, 1, true),
            new THREE.MeshBasicMaterial({ color: tcol, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
          hdr.rotation.x = Math.PI / 2; hdr.position.set(pt.at.x, pt.at.y, 0); g.add(hdr);
          // 接管 + 焊頸 + 法蘭 + 8 螺栓
          const ng = new THREE.Group();
          const pipe = new THREE.Mesh(new THREE.CylinderGeometry(pt.r, pt.r, nozL, 28), std({ color: tcol, metalness: 0.55, roughness: 0.3, emissive: tcol, emissiveIntensity: 0.15 }));
          pipe.rotation.x = Math.PI / 2; pipe.position.z = nozL / 2; ng.add(pipe);
          const neck = new THREE.Mesh(new THREE.CylinderGeometry(pt.r * 1.18, pt.r * 1.5, nozL * 0.2, 28), steelMat);
          neck.rotation.x = Math.PI / 2; neck.position.z = nozL * 0.86; ng.add(neck);
          const fl = new THREE.Mesh(new THREE.CylinderGeometry(pt.r * 1.9, pt.r * 1.9, Math.max(0.03, pt.r * 0.3), 32), steelMat);
          fl.rotation.x = Math.PI / 2; fl.position.z = nozL; ng.add(fl);
          for (let k = 0; k < 8; k++) {
            const a = k / 8 * Math.PI * 2;
            const b = new THREE.Mesh(new THREE.CylinderGeometry(pt.r * 0.12, pt.r * 0.12, pt.r * 0.6, 6), darkMat);
            b.rotation.x = Math.PI / 2; b.position.set(Math.cos(a) * pt.r * 1.55, Math.sin(a) * pt.r * 1.55, nozL); ng.add(b);
          }
          const bore = new THREE.Mesh(new THREE.CircleGeometry(pt.r * 0.85, 24), new THREE.MeshBasicMaterial({ color: 0x0f172a }));
          bore.position.z = nozL + Math.max(0.03, pt.r * 0.3) / 2 + 0.002; ng.add(bore);
          // 流向箭頭
          const ar = new THREE.Mesh(new THREE.ConeGeometry(pt.r * 0.7, pt.r * 1.4, 18), std({ color: tcol, emissive: tcol, emissiveIntensity: 0.6 }));
          ar.rotation.x = pt.dir === 'in' ? -Math.PI / 2 : Math.PI / 2;
          ar.position.z = nozL + pt.r * (pt.dir === 'in' ? 2.4 : 1.6); ng.add(ar);
          ng.position.set(pt.at.x, pt.at.y, pack / 2 + frameT); g.add(ng);
          const lb = pheTextSprite(`${pt.id} ${pt.name} ${Number(pt.T).toFixed(1)}°C`, pheRampCss(wOf(pt.T)), lblH);
          lb.position.set(pt.at.x + Math.sign(pt.at.x) * (pt.r * 2.2 + lblH * 4), pt.at.y + (pt.at.y > 0 ? 1 : -1) * (pt.r * 2.2 + lblH * 0.8), pack / 2 + frameT + nozL * 1.8);
          g.add(lb);
        });

        // 4. 上承載桿、下導桿、後支柱、腳座
        const span = pack + frameT * 2 + Math.max(0.5, H * 0.25);
        const barR = Math.max(0.03, H * 0.016);
        [H / 2 + barR + 0.02, -H / 2 - barR - 0.02].forEach(y => {
          const bar = new THREE.Mesh(new THREE.CylinderGeometry(barR, barR, span, 16), steelMat);
          bar.rotation.x = Math.PI / 2; bar.position.set(0, y, -(span - pack - frameT * 2) / 2 + 0.0); g.add(bar);
        });
        const colZ = -pack / 2 - frameT - Math.max(0.35, H * 0.2);
        const col = new THREE.Mesh(new THREE.BoxGeometry(W * 0.35, H + barR * 4 + 0.12, Math.max(0.08, H * 0.04)), frameMat);
        col.position.set(0, 0, colZ); g.add(col);
        const footGeo = new THREE.BoxGeometry(W * 1.2, Math.max(0.04, H * 0.025), Math.max(0.16, H * 0.09));
        [pack / 2 + frameT / 2, colZ].forEach(z => { const f = new THREE.Mesh(footGeo, frameMat); f.position.set(0, -H / 2 - 0.1, z); g.add(f); });

        // 5. 夾緊螺桿 + 兩端六角螺帽
        const boltR = Math.max(0.014, H * 0.008), boltSpan = pack + frameT * 2 + Math.max(0.2, H * 0.12), bx = W / 2 + boltR * 2.6;
        [H * 0.38, H * 0.13, -H * 0.13, -H * 0.38].forEach(y => [-bx, bx].forEach(x => {
          const b = new THREE.Mesh(new THREE.CylinderGeometry(boltR, boltR, boltSpan, 12), steelMat);
          b.rotation.x = Math.PI / 2; b.position.set(x, y, 0); g.add(b);
          [pack / 2 + frameT + boltR * 1.2, -pack / 2 - frameT - boltR * 1.2].forEach(z => {
            const n = new THREE.Mesh(new THREE.CylinderGeometry(boltR * 2.2, boltR * 2.2, boltR * 2.2, 6), darkMat);
            n.rotation.x = Math.PI / 2; n.position.set(x, y, z); g.add(n);
          });
        }));

        // 6. 流道示蹤粒子：熱側流道自頂部入口角孔流下、冷側流道自底部入口角孔流上（逆流），顏色依當地溫度
        const gaps = Math.max(1, shownPlates - 1);
        const perGap = Math.max(4, Math.min(24, Math.floor(900 / gaps)));
        const n = gaps * perGap;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        const f = { geo, n, s: new Float32Array(n), speed: new Float32Array(n), hot: new Uint8Array(n), portX: new Float32Array(n), xT: new Float32Array(n), z: new Float32Array(n), yTop, yBot, prof, wOf };
        for (let i = 0; i < n; i++) {
          const gi = Math.floor(i / perGap), hot = gi % 2 === 0;
          f.hot[i] = hot ? 1 : 0;
          f.s[i] = Math.random();
          f.speed[i] = 0.16 + Math.random() * 0.08;
          const hotOnPrimary = isPrimaryHot === hot;   // 該流道是一次側（左）還是二次側（右）
          f.portX[i] = hotOnPrimary ? -portX : portX;
          f.xT[i] = (Math.random() - 0.5) * Wp * 0.85;
          f.z[i] = pack / 2 - (gi + 1) * pitch;
        }
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: Math.max(0.018, H * 0.012), vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false }));
        pts.visible = showFlowRef.current;
        g.add(pts);
        f.points = pts;
        flowRef.current = f;
      }, [designArea, primaryDN, secondaryDN, isDarkMode, exploded, thermalKey]);

      const resetCameraView = () => {
        const g = pheGroupRef.current;
        if (!g || !cameraRef.current || !controlsRef.current) return;
        const box = new THREE.Box3().setFromObject(g), size = box.getSize(new THREE.Vector3());
        const d = Math.max(size.x, size.y, size.z) * 1.6;
        cameraRef.current.position.set(d * 0.8, d * 0.42, d * 0.9);
        controlsRef.current.target.set(0, 0, 0);
        controlsRef.current.update();
      };

      const btn = active => `text-[10px] font-mono px-2.5 py-1 rounded border font-bold transition-all shadow-xs ${active
        ? 'bg-amber-500 text-white border-amber-600 dark:bg-amber-600 dark:border-amber-500'
        : 'bg-white/90 text-slate-700 border-slate-300 dark:bg-slate-800/90 dark:text-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700'}`;
      const legendStops = PHE_STOPS.map(([x, c]) => `rgb(${c.map(v => Math.round(v * 255)).join(',')}) ${(x * 100).toFixed(0)}%`).join(',');

      return (
        <div className="relative w-full h-[540px] bg-slate-900/5 dark:bg-slate-950/90 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-inner">
          <div className="absolute top-2 left-2 right-2 z-10 flex items-start justify-between gap-2 pointer-events-none">
            <div className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 shadow-xs pointer-events-auto text-[10px] font-mono text-slate-700 dark:text-slate-200 leading-relaxed">
              <div className="font-bold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>PHE 3D 逆流溫度場</div>
              <div>熱側 {prof.hotIn.toFixed(1)}→{prof.hotOut.toFixed(1)}°C（上進下出）</div>
              <div>冷側 {prof.coldIn.toFixed(1)}→{prof.coldOut.toFixed(1)}°C（下進上出）</div>
              {!prof.valid && <div className="text-red-500 font-bold">溫度條件不成立，以線性示意</div>}
            </div>
            <div className="flex flex-wrap justify-end items-center gap-1.5 pointer-events-auto">
              <button type="button" onClick={() => setExploded(v => !v)} className={btn(exploded)} title="拉開板片間距，觀察熱／冷流道交錯">{exploded ? '收合板片' : '展開板片'}</button>
              <button type="button" onClick={toggleFlow} className={btn(showFlow)} title="顯示流道示蹤粒子">流動示蹤</button>
              <button type="button" onClick={handleToggleRotate} className={btn(autoRotate)}>{autoRotate ? '暫停旋轉' : '自動旋轉'}</button>
              <button type="button" onClick={resetCameraView} className={btn(false)}>重設視角</button>
            </div>
          </div>

          <div className="absolute left-2 top-[86px] bottom-12 z-10 flex gap-1.5 pointer-events-none">
            <div className="w-2.5 rounded-full border border-slate-400/40" style={{ background: `linear-gradient(to top, ${legendStops})` }}></div>
            <div className="flex flex-col justify-between text-[9.5px] font-mono text-slate-600 dark:text-slate-300">
              <span>{prof.hotIn.toFixed(1)}°C</span>
              <span>{((prof.hotIn + prof.coldIn) / 2).toFixed(1)}°C</span>
              <span>{prof.coldIn.toFixed(1)}°C</span>
            </div>
          </div>

    // ==========================================
    // 8. SVG T-Q PROFILE CHART
    // ==========================================
    function TQProfileChart({ result, isDarkMode }) {
      if (!result || !result.isValid) {
        return (
          <div className="panel-card p-6 text-center text-xs text-slate-400 font-mono">
            請修正輸入條件以繪製 T-Q 換熱溫差曲線圖
          </div>
        );
      }

      const { hotIn, hotOut, coldIn, coldOut, effectiveDutyKW, pinchTemp, deltaT1, deltaT2 } = result.thermalResult;

      const width = 600;
      const height = 220;
      const margin = { top: 30, right: 40, bottom: 40, left: 50 };

      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;

      const maxT = Math.max(hotIn, hotOut, coldIn, coldOut) + 3;
      const minT = Math.min(hotIn, hotOut, coldIn, coldOut) - 3;
      const rangeT = maxT - minT || 1;

      const scaleX = (qPercent) => margin.left + (qPercent / 100) * plotW;
      const scaleY = (tempC) => margin.top + plotH - ((tempC - minT) / rangeT) * plotH;

      const points = [0, 25, 50, 75, 100].map(pct => {
        const qFrac = pct / 100;
        const hotT = hotOut + (hotIn - hotOut) * qFrac;
        const coldT = coldIn + (coldOut - coldIn) * qFrac;
        return { pct, qFrac, hotT, coldT, deltaT: hotT - coldT };
      });

      const hotPathD = `M ${scaleX(0)} ${scaleY(hotOut)} L ${scaleX(100)} ${scaleY(hotIn)}`;
      const coldPathD = `M ${scaleX(0)} ${scaleY(coldIn)} L ${scaleX(100)} ${scaleY(coldOut)}`;

      const gridColor = isDarkMode ? "#21262d" : "#e2e8f0";
      const axisColor = isDarkMode ? "#30363d" : "#94a3b8";
      const textColor = isDarkMode ? "#94a3b8" : "#64748b";

      return (
        <div className="panel-card p-4 space-y-2">
          <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                T-Q (溫度-熱負荷) 逆流剖面分佈圖
              </h3>
            </div>
            <span className="text-[10px] font-mono text-emerald-700 bg-emerald-50 dark:bg-emerald-950/60 dark:text-emerald-400 px-2 py-0.5 rounded border border-emerald-200 dark:border-emerald-800/40 font-bold">
              Pinch 接近溫差: {pinchTemp.toFixed(1)} °C
            </span>
          </div>

          <div className="relative w-full overflow-x-auto bg-slate-50 dark:bg-slate-950 rounded-lg p-2 border border-slate-200 dark:border-slate-800">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto max-h-64 select-none">
              {[0, 25, 50, 75, 100].map(pct => (
                <g key={pct}>
                  <line
                    x1={scaleX(pct)}
                    y1={margin.top}
                    x2={scaleX(pct)}
                    y2={margin.top + plotH}
                    stroke={gridColor}
                    strokeDasharray="3 3"
                  />
                  <text
                    x={scaleX(pct)}
                    y={height - 12}
                    fill={textColor}
                    fontSize="10"
                    fontFamily="JetBrains Mono"
                    textAnchor="middle"
                  >
                    {pct}%
                  </text>
                </g>
              ))}

              <line x1={margin.left} y1={margin.top} x2={margin.left} y2={margin.top + plotH} stroke={axisColor} />
              <line x1={margin.left} y1={margin.top + plotH} x2={margin.left + plotW} y2={margin.top + plotH} stroke={axisColor} />

              <path d={hotPathD} fill="none" stroke="#ea580c" strokeWidth="3" strokeLinecap="round" />
              <path d={coldPathD} fill="none" stroke="#0891b2" strokeWidth="3" strokeLinecap="round" />

              {points.map((p, idx) => (
                <g key={idx}>
                  <circle cx={scaleX(p.pct)} cy={scaleY(p.hotT)} r="4" fill="#ea580c" />
                  <text
                    x={scaleX(p.pct)}
                    y={scaleY(p.hotT) - 8}
                    fill="#c2410c"
                    fontSize="9"
                    fontFamily="JetBrains Mono"
                    fontWeight="bold"
                    textAnchor="middle"
                    className="dark:fill-orange-400"
                  >
                    {p.hotT.toFixed(1)}°C
                  </text>

                  <circle cx={scaleX(p.pct)} cy={scaleY(p.coldT)} r="4" fill="#0891b2" />
                  <text
                    x={scaleX(p.pct)}
                    y={scaleY(p.coldT) + 14}
                    fill="#0e7490"
                    fontSize="9"
                    fontFamily="JetBrains Mono"
                    fontWeight="bold"
                    textAnchor="middle"
                    className="dark:fill-cyan-400"
                  >
                    {p.coldT.toFixed(1)}°C
                  </text>

                  <line
                    x1={scaleX(p.pct)}
                    y1={scaleY(p.hotT)}
                    x2={scaleX(p.pct)}
                    y2={scaleY(p.coldT)}
                    stroke={textColor}
                    strokeDasharray="2 2"
                  />
                </g>
              ))}

              <text x={scaleX(100) + 5} y={scaleY(hotIn) + 3} fill="#ea580c" fontSize="10" fontWeight="bold">
                熱側入口 (P1)
              </text>
              <text x={scaleX(0) - 45} y={scaleY(hotOut) + 3} fill="#ea580c" fontSize="10" fontWeight="bold">
                熱側出口 (P2)
              </text>
              <text x={scaleX(100) + 5} y={scaleY(coldOut) + 3} fill="#0891b2" fontSize="10" fontWeight="bold">
                冷側出口 (S2)
              </text>
              <text x={scaleX(0) - 45} y={scaleY(coldIn) + 3} fill="#0891b2" fontSize="10" fontWeight="bold">
                冷側入口 (S1)
              </text>
            </svg>
          </div>
          
          <div className="flex justify-between text-[11px] font-mono text-slate-500 dark:text-slate-400 px-1 pt-1">
            <span>端點 ΔT1 = {deltaT1.toFixed(1)} °C (P1 熱進 - S2 冷出)</span>
            <span>端點 ΔT2 = {deltaT2.toFixed(1)} °C (P2 熱出 - S1 冷進)</span>
          </div>
        </div>
      );
    }

                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-xs font-bold text-slate-800 dark:text-slate-200">開發者測試模式 (Phase 2.5 Suite)</h3>
                      <p className="text-[10px] text-slate-500">開啟後可測試標準工程驗證案例與 3D 渲染壓力</p>
                    </div>
                    <button
                      onClick={() => setDeveloperMode(!developerMode)}
                      className={`px-3 py-1 rounded text-xs font-bold transition-all ${
                        developerMode ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                      }`}
                    >
                      {developerMode ? '開啟中' : '已關閉'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <PrintDataSheetModal
            isOpen={isDataSheetOpen}
            onClose={() => setIsDataSheetOpen(false)}
            inputState={inputState}
            result={result}
          />

          {}
          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 pt-3 text-center text-[11px] text-slate-500 font-mono">
            板式熱交換器 (PHE) 選型、水力學診斷與 3D 實體模型視覺化工具 Phase 2.5
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
